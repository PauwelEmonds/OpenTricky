plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.opentricky'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.opentricky.ssxtricky'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '0.1.0-android'
        ndk {
            // phones and tablets; x86_64 for the emulator and Chromebooks. -PotAbis=arm64-v8a builds one.
            abiFilters(*(project.hasProperty('otAbis') ? project.otAbis.split(',') : ['arm64-v8a', 'x86_64']))
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'   // 16 KB pages (Android 15 devices)
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        debug {
            // The translated game is 47 MB of C: an unoptimised build would not keep up.
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
    lint {
        abortOnError false
    }
}
